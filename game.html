<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>整合式抽獎與計時平台 (AI 加強版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* --- 全域樣式 --- */
        body {
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        }

        /* 自定義捲軸 */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* --- 3D 場景樣式 (左側) --- */
        .scene {
            perspective: 1000px;
        }

        .cube-container {
            width: 100px;
            height: 100px;
            position: relative;
            transform-style: preserve-3d;
            transform: rotateX(-20deg) rotateY(-25deg);
            transition: transform 0.3s;
            cursor: pointer;
        }

        .cube-face {
            position: absolute;
            width: 100px;
            height: 100px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            transition: background-color 0.2s, box-shadow 0.2s;
            font-size: 16px;
            line-height: 1.2;
            font-weight: bold;
            text-align: center;
            padding: 5px;
            word-break: break-word;
            overflow: hidden;
            user-select: none;
            backface-visibility: hidden;
            /* 效能優化 */
        }

        /* 方塊面定位 (translateZ = 50px) */
        .front {
            transform: rotateY(0deg) translateZ(50px);
        }

        .back {
            transform: rotateY(180deg) translateZ(50px);
        }

        .right {
            transform: rotateY(90deg) translateZ(50px);
        }

        .left {
            transform: rotateY(-90deg) translateZ(50px);
        }

        .top {
            transform: rotateX(90deg) translateZ(50px);
        }

        .bottom {
            transform: rotateX(-90deg) translateZ(50px);
        }

        .cube-face-dark {
            background-color: #7f1d1d;
            opacity: 0.95;
        }

        .cube-active .cube-face {
            background-color: #ef4444;
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.6);
            border-color: #fff;
            z-index: 10;
        }

        /* --- 計時器樣式 (右下) --- */
        .timer-ring-circle {
            transition: stroke-dashoffset 0.35s;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }

        .blink {
            animation: blink-animation 1s steps(5, start) infinite;
        }

        @keyframes blink-animation {
            to {
                visibility: hidden;
            }
        }

        /* --- 彈窗動畫 --- */
        .pop-in {
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* --- AI 載入動畫 --- */
        .loading-dots:after {
            content: ' .';
            animation: dots 1s steps(5, end) infinite;
        }

        @keyframes dots {

            0%,
            20% {
                color: rgba(0, 0, 0, 0);
                text-shadow: .25em 0 0 rgba(0, 0, 0, 0), .5em 0 0 rgba(0, 0, 0, 0);
            }

            40% {
                color: white;
                text-shadow: .25em 0 0 rgba(0, 0, 0, 0), .5em 0 0 rgba(0, 0, 0, 0);
            }

            60% {
                text-shadow: .25em 0 0 white, .5em 0 0 rgba(0, 0, 0, 0);
            }

            80%,
            100% {
                text-shadow: .25em 0 0 white, .5em 0 0 white;
            }
        }

        @keyframes drop-out {
            0% {
                transform: translateY(-50px) scale(0.5);
                opacity: 0;
            }

            50% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }

            70% {
                transform: translateY(-10px);
            }

            100% {
                transform: translateY(0);
            }
        }
    </style>
</head>

<body class="bg-gray-100 h-screen w-screen overflow-hidden flex flex-col lg:flex-row">

    <!-- 左側區域 (2/3): 3D 抽獎舞台 -->
    <section
        class="w-full lg:w-2/3 h-[60%] lg:h-full bg-gray-900 relative flex flex-col border-r border-gray-800 shadow-2xl z-10">
        <!-- 標題列 -->
        <div class="absolute top-0 left-0 w-full p-6 flex justify-between items-start pointer-events-none z-20">
            <div>
                <h1 class="text-3xl font-black text-white tracking-wider drop-shadow-md">
                    <span class="text-red-500">LUCKY</span> DRAW
                </h1>
                <p class="text-gray-400 text-sm mt-1">剔除式 3D 抽獎系統 (Gemini AI Powered)</p>
            </div>
            <div
                class="bg-black/30 backdrop-blur px-2 py-1.5 rounded-full border border-white/10 text-white/80 text-sm pointer-events-auto flex items-center gap-2">
                <div class="flex bg-black/40 rounded-full p-1">
                    <button id="btn-mode-cubes" onclick="switchView('cubes')"
                        class="px-4 py-1.5 rounded-full text-xs font-bold transition-all text-white bg-indigo-600 shadow-md">
                        🎲 方塊抽獎
                    </button>
                    <button id="btn-mode-gachapon" onclick="switchView('gachapon')"
                        class="px-4 py-1.5 rounded-full text-xs font-bold transition-all text-gray-400 hover:text-white">

                    </button>
                </div>
                <div class="w-px h-4 bg-white/10 mx-1"></div>
                <span id="box-count-display" class="px-2">載入中...</span>
            </div>
        </div>

        <!-- 3D 內容容器 -->
        <div class="flex-1 overflow-y-auto custom-scrollbar relative bg-gradient-to-b from-gray-900 to-gray-800">
            <!-- Cubes View -->
            <div id="view-mode-cubes" class="w-full min-h-full relative transition-opacity duration-300">
                <!-- 網格背景 -->
                <div class="absolute inset-0 opacity-5 pointer-events-none"
                    style="background-image: linear-gradient(#ffffff 1px, transparent 1px), linear-gradient(90deg, #ffffff 1px, transparent 1px); background-size: 40px 40px;">
                </div>

                <!-- 舞台 -->
                <div id="boxes-stage"
                    class="scene flex flex-wrap justify-center content-center gap-16 p-20 min-h-full w-full">
                    <!-- JS 動態生成方塊 -->
                </div>
            </div>

            <!-- Timer Alert Modal -->
            <div id="timer-alert-modal"
                class="hidden fixed inset-0 flex items-center justify-center z-50 bg-black/50 backdrop-blur-sm">
                <div
                    class="bg-slate-800 p-8 rounded-2xl border-2 border-red-500 shadow-[0_0_50px_rgba(239,68,68,0.5)] text-center max-w-sm mx-4 transform scale-100 transition-all">
                    <div class="text-6xl mb-4">⏰</div>
                    <h2 class="text-3xl font-bold text-white mb-2">時間到！</h2>
                    <p class="text-slate-300 mb-8">Time's Up!</p>
                    <button onclick="stopTimerAlert()"
                        class="bg-red-600 hover:bg-red-500 text-white font-bold py-3 px-8 rounded-full text-lg shadow-lg hover:shadow-red-500/50 transition-all active:scale-95 flex items-center justify-center gap-2 mx-auto">
                        <span>🔕</span>
                        關閉提醒音效
                    </button>
                </div>
            </div>

            <!-- Gachapon View -->
            <div id="view-mode-gachapon"
                class="bg-slate-900 absolute inset-0 w-full h-full opacity-0 pointer-events-none transition-opacity duration-300 flex items-center justify-center overflow-hidden">
                <!-- 扭蛋機本體 -->
                <div class="relative w-[450px] h-[600px] flex flex-col items-center z-10 scale-90 lg:scale-100">


                    <!-- 透明球體 (橢圓) -->
                    <div
                        class="relative mt-8 w-[420px] h-[320px] rounded-[50%] border-4 border-gray-200/20 bg-white/5 backdrop-blur-sm shadow-[inset_0_0_40px_rgba(255,255,255,0.1)] z-10 overflow-hidden ring-1 ring-white/10">
                        <!-- 光澤 -->
                        <div
                            class="absolute top-10 left-10 w-20 h-10 bg-white/10 rounded-full transform -rotate-45 blur-md">
                        </div>
                        <div
                            class="absolute bottom-10 right-10 w-32 h-32 bg-blue-500/10 rounded-full filter blur-xl mix-blend-overlay">
                        </div>

                        <!-- 扭蛋球容器 -->
                        <div id="balls-container" class="absolute inset-0 w-full h-full">
                            <!-- JS 生成小球 -->
                        </div>
                    </div>

                    <!-- 機身底座 -->
                    <div
                        class="relative -mt-10 w-96 h-auto flex-1 bg-red-600 rounded-3xl rounded-t-[50px] shadow-2xl flex flex-col items-center p-4 border-t-8 border-red-700">
                        <!-- 裝飾 -->
                        <div
                            class="absolute top-4 left-4 right-4 h-32 bg-red-500 rounded-2xl border-2 border-red-400/30 shadow-inner overflow-hidden">
                            <div
                                class="w-full h-full opacity-20 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-yellow-300 via-transparent to-transparent">
                            </div>
                        </div>

                        <!-- 投幣/旋鈕區 與 出口 (並排) -->
                        <div class="mt-auto mb-4 w-full flex flex-row justify-around items-end px-8 relative z-20">
                            <!-- 旋鈕 -->
                            <div class="relative">
                                <div
                                    class="w-24 h-24 bg-gray-200 rounded-full border-8 border-gray-300 shadow-[inset_0_2px_10px_rgba(0,0,0,0.2)] flex items-center justify-center relative bg-gradient-to-b from-gray-100 to-gray-300">
                                    <div id="machine-handle"
                                        class="w-16 h-3 bg-gray-400 absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 rounded cursor-pointer hover:bg-gray-300 transition-colors shadow-md border-b-4 border-gray-500">
                                        <div class="w-2 h-full bg-gray-300 mx-auto"></div>
                                    </div>
                                    <div
                                        class="w-8 h-8 rounded-full bg-gray-400 border-2 border-gray-500/50 absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 pointer-events-none">
                                    </div>
                                </div>
                            </div>

                            <!-- 出口 -->
                            <div id="exit-hole"
                                class="w-24 h-24 bg-gray-900 rounded-full border-4 border-gray-700 shadow-[inset_0_10px_20px_rgba(0,0,0,0.8)] relative overflow-visible flex justify-center items-end">
                                <div class="w-20 h-10 bg-black/60 rounded-b-full mb-1"></div>
                            </div>
                        </div>

                        <div
                            class="absolute bottom-4 left-6 w-3 h-3 rounded-full bg-yellow-400 shadow-[0_0_10px_rgba(250,204,21,0.6)] animate-pulse">
                        </div>
                        <div class="absolute bottom-4 right-6 w-3 h-3 rounded-full bg-green-400 shadow-[0_0_10px_rgba(74,222,128,0.6)] animate-pulse"
                            style="animation-delay: 0.5s;"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 底部控制按鈕 -->
        <div class="p-6 bg-gray-900/90 backdrop-blur border-t border-gray-800 flex justify-center z-20">
            <button id="start-lottery-btn" onclick="startLottery()"
                class="bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-500 hover:to-rose-500 text-white text-xl font-bold py-4 px-16 rounded-full shadow-lg shadow-red-900/50 transform transition active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none tracking-widest border border-red-400/20">
                開始抽獎
            </button>
        </div>

        <!-- 中獎全螢幕遮罩 -->
        <div id="winner-overlay"
            class="absolute inset-0 bg-black/85 z-50 hidden flex flex-col items-center justify-center p-4 backdrop-blur-md">
            <div
                class="pop-in bg-white rounded-3xl p-10 text-center max-w-md w-full shadow-2xl border-8 border-yellow-400 relative">
                <div class="text-7xl mb-6">🏆</div>
                <h3 class="text-gray-400 font-bold mb-2 uppercase tracking-wide">Winner</h3>
                <div id="winner-text" class="text-5xl font-black text-gray-800 mb-8 break-words leading-tight">
                    <!-- 中獎內容 -->
                </div>
                <div class="bg-red-50 rounded-lg p-3 mb-6 border border-red-100">
                    <p class="text-red-500 text-sm font-medium">注意：此項目將標記為「已抽出 (隱藏)」</p>
                </div>
                <button onclick="closeWinner()"
                    class="w-full bg-gray-900 text-white py-4 rounded-xl hover:bg-gray-800 transition font-bold text-lg shadow-lg">
                    確認並隱藏
                </button>
            </div>
        </div>
    </section>

    <!-- 右側區域 (1/3): 工具欄 -->
    <aside class="w-full lg:w-1/3 h-[40%] lg:h-full flex flex-col bg-white z-20">

        <!-- 右上: 列表設定 (佔剩餘空間) -->
        <div class="flex-1 flex flex-col min-h-0 border-b border-gray-200 relative">
            <div class="bg-indigo-600 p-4 text-white flex justify-between items-center shadow-md z-10">
                <h2 class="font-bold flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="8" y1="6" x2="21" y2="6"></line>
                        <line x1="8" y1="12" x2="21" y2="12"></line>
                        <line x1="8" y1="18" x2="21" y2="18"></line>
                        <line x1="3" y1="6" x2="3.01" y2="6"></line>
                        <line x1="3" y1="12" x2="3.01" y2="12"></line>
                        <line x1="3" y1="18" x2="3.01" y2="18"></line>
                    </svg>
                    列表設定
                </h2>
                <!-- AI 觸發按鈕 -->
                <button onclick="toggleAIModal('list')"
                    class="bg-indigo-500 hover:bg-indigo-400 text-white text-xs px-3 py-1.5 rounded-full font-bold flex items-center gap-1 transition-colors shadow-sm border border-indigo-400">
                    ✨ AI 幫我想
                </button>
            </div>

            <!-- 列表內容區 -->
            <div class="flex-1 overflow-y-auto custom-scrollbar p-4 bg-gray-50 flex flex-col">
                <div class="flex justify-between items-center mb-2 px-1">
                    <span id="mode-badge"
                        class="px-2 py-0.5 text-xs font-bold rounded bg-indigo-500 border border-indigo-400 text-white">唯讀</span>
                </div>

                <!-- 新增區 -->
                <div id="add-container" class="hidden mb-3 flex gap-2 shrink-0 transition-all">
                    <input type="text" id="new-item-input" placeholder="輸入新選項..."
                        class="flex-1 border border-gray-300 rounded-lg px-3 py-2 focus:border-indigo-500 focus:outline-none shadow-sm text-sm"
                        onkeypress="if(event.key==='Enter') addItem()">
                    <button onclick="addItem()"
                        class="bg-indigo-600 text-white px-3 py-2 rounded-lg hover:bg-indigo-700 shadow-sm">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                    </button>
                </div>

                <!-- 列表 -->
                <div id="list-container" ondblclick="enterEditMode()"
                    class="flex-1 bg-white border border-gray-200 rounded-xl p-2 cursor-pointer shadow-sm hover:shadow-md transition-shadow">
                    <!-- JS 生成 -->
                </div>
                <p class="text-center text-xs text-gray-400 mt-2 select-none">雙擊列表進行編輯</p>
            </div>

            <!-- 列表底部按鈕 -->
            <div class="p-4 bg-white border-t border-gray-100 flex gap-2">
                <button id="reset-list-btn" onclick="resetList()"
                    class="bg-gray-200 text-gray-600 px-3 py-2 rounded-lg font-bold text-sm hover:bg-gray-300 transition-colors">
                    重置
                </button>
                <button id="save-btn" onclick="saveList()" disabled
                    class="flex-1 py-2 px-4 rounded-lg font-bold text-sm transition-all duration-200 bg-gray-100 text-gray-400 cursor-not-allowed">
                    儲存列表變更
                </button>
            </div>

            <!-- AI 列表生成 Modal (絕對定位) -->
            <div id="ai-list-modal"
                class="absolute top-0 left-0 w-full h-full bg-white/95 backdrop-blur-sm z-30 hidden flex flex-col p-6 animate-fade-in">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-lg font-bold text-indigo-700 flex items-center gap-2">✨ AI 靈感助手</h3>
                    <button onclick="toggleAIModal('list')" class="text-gray-400 hover:text-gray-600">✕</button>
                </div>
                <p class="text-sm text-gray-600 mb-2">輸入主題（例如：台北午餐、團康遊戲），AI 將自動為您產生選項。</p>
                <textarea id="ai-list-prompt"
                    class="w-full h-24 border border-gray-300 rounded-lg p-3 text-sm focus:border-indigo-500 focus:outline-none resize-none mb-4"
                    placeholder="請輸入主題..."></textarea>
                <button onclick="generateAIList()" id="ai-list-btn"
                    class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-bold py-3 rounded-lg shadow-md transition-all flex justify-center items-center gap-2">
                    <span>開始生成</span>
                </button>
            </div>
        </div>

        <!-- 右下: 計時器 (固定高度或自動適應) -->
        <div
            class="bg-slate-800 p-6 flex flex-col items-center justify-center text-white shrink-0 relative overflow-hidden">
            <!-- 裝飾背景 -->
            <div
                class="absolute top-0 right-0 w-32 h-32 bg-blue-500 rounded-full mix-blend-overlay filter blur-3xl opacity-20">
            </div>

            <div class="w-full flex justify-between items-center mb-4 z-10">
                <h2 class="text-sm font-bold text-slate-400 tracking-widest flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polyline points="12 6 12 12 16 14"></polyline>
                    </svg>
                    倒數計時器
                </h2>
                <!-- AI 計時按鈕 -->
                <button onclick="toggleAIModal('timer')"
                    class="text-xs bg-slate-700 hover:bg-slate-600 text-blue-300 px-2 py-1 rounded border border-slate-600 transition-colors flex items-center gap-1">
                    ✨ 智慧設定
                </button>
            </div>

            <div class="flex items-center gap-6 w-full z-10">
                <!-- 環形進度與時間顯示 -->
                <div class="relative w-24 h-24 flex-shrink-0">
                    <svg class="w-full h-full transform -rotate-90">
                        <circle cx="48" cy="48" r="44" stroke="currentColor" stroke-width="6" fill="transparent"
                            class="text-slate-700" />
                        <circle id="timer-ring" cx="48" cy="48" r="44" stroke="currentColor" stroke-width="6"
                            fill="transparent" stroke-dasharray="276" stroke-dashoffset="0" stroke-linecap="round"
                            class="text-blue-500 transition-all duration-1000 ease-linear" />
                    </svg>
                    <div id="timer-display"
                        class="absolute top-0 left-0 w-full h-full flex items-center justify-center text-2xl font-mono font-bold">
                        00:00
                    </div>
                </div>

                <!-- 控制區 -->
                <div class="flex-1 flex flex-col gap-3">
                    <!-- 輸入 -->
                    <div id="timer-inputs" class="flex gap-2 justify-center transition-opacity">
                        <input type="number" id="t-min" placeholder="分" min="0" max="60" value="3"
                            class="w-16 bg-slate-700 border border-slate-600 rounded text-center py-2 focus:border-blue-500 outline-none placeholder-slate-500">
                        <input type="number" id="t-sec" placeholder="秒" min="0" max="59" value="0"
                            class="w-16 bg-slate-700 border border-slate-600 rounded text-center py-2 focus:border-blue-500 outline-none placeholder-slate-500">
                    </div>

                    <!-- 按鈕 -->
                    <div class="flex gap-2">
                        <button id="t-start" onclick="startTimer()"
                            class="flex-1 bg-blue-600 hover:bg-blue-500 py-2 rounded font-bold text-sm transition text-white">開始</button>
                        <button id="t-reset" onclick="resetTimer()"
                            class="bg-slate-600 hover:bg-slate-500 px-3 py-2 rounded font-bold text-sm transition text-white">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 12"></path>
                                <path d="M3 5v7h7"></path>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>

            <p id="timer-msg" class="text-xs text-slate-400 mt-2 h-4 text-center w-full truncate"></p>

            <!-- AI 計時 Modal (絕對定位) -->
            <div id="ai-timer-modal"
                class="absolute top-0 left-0 w-full h-full bg-slate-800/95 backdrop-blur-sm z-30 hidden flex flex-col p-6 animate-fade-in border-t border-slate-600">
                <div class="flex justify-between items-center mb-2">
                    <h3 class="text-sm font-bold text-blue-400 flex items-center gap-2">✨ 智慧計時</h3>
                    <button onclick="toggleAIModal('timer')" class="text-slate-400 hover:text-white">✕</button>
                </div>
                <p class="text-xs text-slate-400 mb-2">輸入任務 (如: 煮半熟蛋)，AI 自動設定時間。</p>
                <div class="flex gap-2 mb-2">
                    <input type="text" id="ai-timer-prompt"
                        class="flex-1 bg-slate-700 border border-slate-600 rounded px-2 py-1 text-sm text-white focus:border-blue-500 outline-none"
                        placeholder="輸入任務...">
                </div>
                <button onclick="generateAITimer()" id="ai-timer-btn"
                    class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 rounded text-sm transition-all flex justify-center items-center gap-2">
                    <span>設定</span>
                </button>
            </div>
        </div>
    </aside>

    <script>
        /* =========================================
           0. Gemini API 設定
           ========================================= */
        const apiKey = ""; // 系統會自動填入 API Key

        async function callGeminiAPI(prompt, systemInstruction) {
            if (!apiKey) {
                alert("API Key 尚未設定，無法使用 AI 功能。");
                return null;
            }

            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;

            const payload = {
                contents: [{ parts: [{ text: prompt }] }],
                systemInstruction: { parts: [{ text: systemInstruction }] },
                generationConfig: {
                    responseMimeType: "application/json"
                }
            };

            // 實作指數退避 (Exponential Backoff)
            const maxRetries = 3;
            let attempt = 0;
            let delay = 1000;

            while (attempt < maxRetries) {
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);

                    const data = await response.json();
                    const text = data.candidates?.[0]?.content?.parts?.[0]?.text;

                    if (text) {
                        return JSON.parse(text);
                    } else {
                        throw new Error("No text in response");
                    }

                } catch (e) {
                    console.error(`Attempt ${attempt + 1} failed:`, e);
                    attempt++;
                    if (attempt === maxRetries) {
                        alert("AI 連線失敗，請稍後再試。");
                        return null;
                    }
                    await new Promise(resolve => setTimeout(resolve, delay));
                    delay *= 2;
                }
            }
        }

        /* =========================================
           1. 全域資料與初始化

        // 簡單音效產生器 (共用)
        let audioCtx;
        function playBeep(freq, duration, type) {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = type || 'sine';
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }
